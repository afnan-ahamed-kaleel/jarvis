<!DOCTYPE html>
<html lang="en">
<head>
  <title>Jarvis Chatbot</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="app">
    <div class="glass-card">

      <!-- Header -->
      <div class="app-header">
        <h1>Jarvis</h1>
        <p>Your AI mental health assistant</p>
      </div>

      <!-- AI Orb / Icon -->
      <div class="ai-visual">
        <span style="font-size:64px;">🤖</span>
      </div>

      <!-- Chat Box -->
      <div id="chatBox"
           style="
             height: 260px;
             background: rgba(255,255,255,0.55);
             border-radius: 18px;
             padding: 14px;
             overflow-y: auto;
             margin-bottom: 14px;
           ">
      </div>

      <!-- Input Row -->
      <div style="display:flex; gap:10px;">
        <input
          type="text"
          id="userInput"
          placeholder="Type your message..."
          style="
            flex:1;
            padding: 12px 14px;
            border-radius: 14px;
            border: none;
            outline: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
          "
        >

        <button
          onclick="sendMessage()"
          class="mood"
          style="padding: 12px 18px;"
        >
          Send
        </button>
      </div>

    </div>
  </div>

  <!-- Floating Back Button -->
  <a href="Jarvis.html"
     style="
       position: fixed;
       bottom: 20px;
       right: 20px;
       padding: 12px 16px;
       border-radius: 50px;
       background: rgba(255,255,255,0.4);
       backdrop-filter: blur(14px);
       text-decoration: none;
       font-size: 0.8rem;
       color: #34495e;
       box-shadow: 0 12px 24px rgba(0,0,0,0.15);
     ">
    ⬅ Back
  </a>





  <script src="js/chatbot.js"></script>
</body>
</html>
