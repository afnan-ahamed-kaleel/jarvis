<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis – Mental Health Assistant</title>

  <style>
    /* ===== Base Reset ===== */
    * {
      box-sizing: border-box;
      font-family: "SF Pro Display", "Segoe UI", Inter, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center , #306f9f, #f0f7fc),
        linear-gradient(135deg, #063776, #eef3ff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #211f3d;
      overflow-x: hidden;
    }

    /* ===== App Wrapper ===== */
    .app {
      width: 100%;
      max-width: 420px;
      padding: 18px;
    }

    /* ===== Glass Card ===== */
    .glass-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border-radius: 26px;
      padding: 28px 22px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      animation: floatIn 0.7s ease;
      transition: transform 0.4s ease;
    }
    .glass-card:hover {
      transform: perspective(900px) rotateX(1deg) rotateY(-1deg);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== Header ===== */
    .app-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .app-header h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .app-header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: rgba(31, 45, 61, 0.65);
    }

    /* ===== AI Orb ===== */
    .ai-visual {
      width: 240px;
      height: 240px;
      margin: 18px auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-visual img {
      width: 220px;
      height: auto;
      object-fit: contain;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 20px 40px rgba(77, 163, 255, 0.35));
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    /* ===== Mood Section ===== */
    .mood-section h2 {
      font-size: 1rem;
      text-align: center;
      margin-bottom: 18px;
      color: #4b5c6f;
    }

    .moods {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .mood {
      padding: 16px;
      border-radius: 18px;
      border: none;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .mood:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 28px rgba(0,0,0,0.15);
    }

    .mood:active {
      transform: scale(0.97);
    }

    /* Mood Gradients */
    .happy { background: linear-gradient(135deg, #fff6d8, #ffeaa7); }
    .okay { background: linear-gradient(135deg, #e3ecff, #e9ecef); }
    .sad { background: linear-gradient(135deg, #3d3e42, #d0ddff); }
    .stressed { background: linear-gradient(135deg, #ffe3e3, #ffb3b3); }

    /* Mood Result */
    #result {
      margin-top: 14px;
      text-align: center;
      font-weight: 500;
      color: #2c7be5;
    }

    /* ===== Bottom Glass Nav ===== */
    .glass-nav {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(18px);
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.12);
    }

    .glass-nav a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 0.75rem;
      color: #34495e;
      padding: 10px 6px;
      border-radius: 14px;
      transition: background 0.15s ease;
    }

    .glass-nav a:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* ===== Responsive AI Orb ===== */
    @media (max-width: 480px) {
      .ai-visual { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="glass-card">
      <header class="app-header">
        <div class="ai-visual">
          <img src="pic&animations/JARVIS-LOGOfull.jpg" alt="Jarvis Logo">
        </div>
        <h1>Jarvis</h1>
        <p>Your AI mental wellness companion</p>
      </header>

      <section class="mood-section">
        <h2>How are you feeling today?</h2>
        <div class="moods">
          <button class="mood happy" onclick="saveMood('Happy')">😊 Happy</button>
          <button class="mood okay" onclick="saveMood('Okay')">😐 Okay</button>
          <button class="mood sad" onclick="saveMood('Sad')">😞 Sad</button>
          <button class="mood stressed" onclick="saveMood('Stressed')">😡 Stressed</button>
        </div>
        <p id="result"></p>
      </section>
    </div>

    <nav class="glass-nav">
      <a href="chatbot.html">Chat</a>
      <a href="wellness.html">Wellness</a>
      <a href="resources.html">Resources</a>
      <a href="emergency.html">SOS</a>
    </nav>
  </div>

  <script>
    function saveMood(mood) {
      const result = document.getElementById("result");
      result.textContent = `You selected: ${mood}`;
    }
  </script>

</body>
</html>
