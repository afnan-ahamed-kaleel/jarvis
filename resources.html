<!DOCTYPE html>
<html lang="en">
<head>
  <title>Resources – Jarvis</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="app">
    <div class="glass-card">

      <!-- Header -->
      <header class="app-header">
        <h1>Resources</h1>
        <p>Helpful tools for your mental wellbeing 📚</p>
      </header>

      <!-- Visual -->
      <div class="ai-visual">
        <span style="font-size:58px;">📚</span>
      </div>

      <!-- Resources List -->
      <section class="mood-section">

        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >

          <div class="mood okay">
            🧘 <strong>Breathing Exercise</strong><br>
            Inhale 4s · Hold 4s · Exhale 4s
          </div>

          <div class="mood happy">
            💤 <strong>Sleep Tip</strong><br>
            Avoid phone usage before bedtime
          </div>

          <div class="mood sad">
            📝 <strong>Gratitude Practice</strong><br>
            Write one good thing that happened today
          </div>

        </div>

      </section>

    </div>


  <!-- Floating Back Button -->
  <a href="Jarvis.html"
     style="
       position: fixed;
       bottom: 20px;
       right: 20px;
       padding: 12px 16px;
       border-radius: 50px;
       background: rgba(255,255,255,0.4);
       backdrop-filter: blur(14px);
       text-decoration: none;
       font-size: 0.8rem;
       color: #34495e;
       box-shadow: 0 12px 24px rgba(0,0,0,0.15);
     ">
    ⬅ Back
  </a>

</body>
</html>
