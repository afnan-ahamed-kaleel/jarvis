<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Login</title>
  <style>
    /* ===== Base Reset ===== */
    * { box-sizing: border-box; font-family: "SF Pro Display", "Segoe UI", Inter, sans-serif; margin:0; padding:0;}
    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #306f9f, #f0f7fc),
                  linear-gradient(135deg, #063776, #eef3ff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #211f3d;
      overflow-x: hidden;
    }

    .app { width:100%; max-width:420px; padding:18px; }
    .login-card {
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(22px) saturate(160%);
      border-radius: 26px;
      padding:32px 24px;
      box-shadow:0 30px 60px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.4);
      animation: floatIn 0.7s ease;
      transition: transform 0.4s ease;
    }
    .login-card:hover { transform: perspective(900px) rotateX(1deg) rotateY(-1deg); }
    @keyframes floatIn { from {opacity:0; transform:translateY(20px) scale(0.96);} to {opacity:1; transform:translateY(0) scale(1);} }

    .login-logo { width:240px; height:240px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; }
    .login-logo img { width:90px; height:auto; object-fit:contain; filter:drop-shadow(0 18px 36px rgba(77,163,255,0.35)); animation: float 4s ease-in-out infinite;}
    @keyframes float { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-12px);} }

    .login-title { font-size:1.8rem; text-align:center; margin-bottom:6px; }
    .login-subtitle { font-size:0.9rem; text-align:center; margin:6px 0 22px; color: rgba(31,45,61,0.65); }

    .login-card input {
      width:100%; padding:13px 14px; margin:8px 0; border-radius:14px; border:none; outline:none;
      font-size:0.9rem; background:rgba(255,255,255,0.6); backdrop-filter:blur(10px);
    }

    .login-btn {
      margin-top:14px; width:100%; padding:14px; border-radius:18px; border:none; cursor:pointer;
      font-size:0.95rem; color:white; background:linear-gradient(135deg, #4da3ff, #2c7be5);
      box-shadow:0 12px 26px rgba(44,123,229,0.4); transition: transform 0.2s ease;
    }

    .login-btn:hover { transform:translateY(-2px); }
    .login-secondary { margin-top:12px; text-align:center; font-size:0.8rem; color:#4b5c6f; }

    @media(max-width:480px){ .login-logo{width:180px;height:180px;} .login-logo img{width:70px;} }
  </style>
</head>
<body>

  <div class="app">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <img src="pic&animations/JARVIS-LOGOfull.jpg" alt="Jarvis Logo">
      </div>

      <!-- Title -->
      <h1 class="login-title">Jarvis</h1>
      <p class="login-subtitle">Your AI mental wellness companion</p>

      <!-- Login Form -->
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" onclick="login()">Sign In</button>

      <p class="login-secondary">Don't have an account? Sign up</p>

    </div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // Check if username is a string and password is a number
      if(username !== "" && !isNaN(password) && password !== "") {
        // Redirect to home page (Jarvis.html)
        window.location.href = "Jarvis.html";
      } else {
        alert("Please enter a valid username (text) and password (numbers).");
      }
    }
  </script>

</body>
</html>
